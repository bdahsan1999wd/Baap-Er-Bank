<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page Title Added -->
    <title>Baap Er Bank</title>
    <!-- Tailwind CSS CDN Added -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-rose-200">

    <!----- Header Section Added ----->
    <header>
        <h1 class="text-5xl text-center text-violet-500 font-medium mt-12">Welcome to my
            <span class="font-bold text-violet-800">Baap Er Bank</span> !!!
        </h1>
    </header>

    <main>

        <!----- Login Section Added ----->
        <section class="bg-blue-200 w-9/12 mx-auto mt-12 p-8 rounded ">

            <h3 class="text-3xl mb-4 font-medium text-blue-600">Please Login</h3>

            <div class="">
                <input class="w-9/12 block mb-2 px-3 py-2 rounded" type="email" name="" id="user-email"
                    placeholder="Your Email Address">

                <input class="w-9/12 block mb-2 px-3 py-2 rounded mt-4" type="password" name="" id="user-password"
                    placeholder="Your Password">

                <button id="btn-submit"
                    class="bg-violet-700 hover:bg-rose-500 px-8 py-2 text-white font-medium rounded mt-4">Submit</button>
            </div>

        </section>

    </main>

    <!-- ===== External JavaScript File Added ===== -->

    <!-- Handles login validation and authentication logic -->
    <script src="js/login.js"></script>

</body>

</html>
